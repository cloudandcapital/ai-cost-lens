[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-cost-lens"
version = "0.3.0"
description = "Strict AI usage cost analysis with pricing provenance and CCAC output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diana Molski" }]
keywords = ["finops", "ai", "openai", "anthropic", "bedrock", "cost", "focus", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "black>=26,<27",
    "flake8>=7,<8",
    "isort>=6,<7",
    "pip-audit>=2.10,<3",
    "pytest>=9.0.3,<10",
]

[project.scripts]
ai-cost-lens = "ai_cost_lens.cli:main"

[project.urls]
Homepage = "https://github.com/cloudandcapital/ai-cost-lens"
Repository = "https://github.com/cloudandcapital/ai-cost-lens.git"
"Bug Tracker" = "https://github.com/cloudandcapital/ai-cost-lens/issues"

[tool.hatch.version]
path = "ai_cost_lens/__init__.py"

[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"
